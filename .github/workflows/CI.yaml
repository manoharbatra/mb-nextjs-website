name: College To Corporate

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Check out the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Run linting
      - name: Run linting
        run: npm run lint
        continue-on-error: true

      #Initialize CI log
      - name: Initialize CI Log
        run: |
          echo "CI Log initialized" > ci.log

      # Build the app
      - name: Build Next.js app
        run: |
          npm run build 2>&1 | tee -a ci.log
        env:
          CI: true

      # Upload CI log
      - name: Upload CI Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log
          path: ci.log

      # Install Gemini SDK
      - name: Install Gemini SDK
        if: always()
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai

      # Generate RCA
      - name: Generate RCA
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/failure_analysis.py

      # Publish RCA summary
      - name: Publish RCA Summary
        if: always()
        run: |
          echo "## 🚨 PRISM RCA Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat rca_summary.md >> $GITHUB_STEP_SUMMARY

      # Verify RCA file
      - name: Verify RCA File
        if: always()
        run: |
          pwd
          ls -la
          cat rca.md

      # Rename RCA file
      - name: Rename RCA
        if: always()
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          mv rca.md ci-rca-${SHORT_SHA}.md

      # Upload RCA artifact
      - name: Upload RCA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-rca
          path: ci-rca-*.md

      # Check if build output exists
      - name: Check build output
        run: |
          if [ -d ".next" ]; then
            echo "✓ Build directory exists"
            ls -la .next/ | head -20
          else
            echo "✗ Build directory .next/ NOT found!"
            ls -la
            exit 1
          fi

      # Upload build artifacts
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: next-build-22x
          path: .next/
          retention-days: 5

      # Verify build succeeded
      - name: Verify build
        run: |
          echo "✓ Build completed successfully!"
          echo "Build output directory size: $(du -sh .next/)"