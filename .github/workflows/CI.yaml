name: College To Corporate

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # Check out the code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Setup Node.js
      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      
      # Install dependencies
      - name: Install dependencies
        run: npm ci
      
      # Run linting
      - name: Run linting
        run: npm run lint
        continue-on-error: true
      
      # Build the app
      - name: Build Next.js app
        run: npm run build
        env:
          CI: true
      
      # Check if build was successful
      - name: Check build output
        run: |
          if [ -d ".next" ]; then
            echo "✓ Build directory exists"
            ls -la .next/ | head -20
          else
            echo "✗ Build directory .next/ NOT found!"
            ls -la
            exit 1
          fi
      
      # Optional: Upload build artifacts
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: next-build-22x
          path: .next/
          retention-days: 5
      
      # Verify build succeeded
      - name: Verify build
        run: |
          echo "✓ Build completed successfully!"
          echo "Build output directory size: $(du -sh .next/)"